[package]
name = "allsquare"
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
description = "Client library for the Square Golf Omni launch monitor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/divotmaker/allsquare"
keywords = ["golf", "launch-monitor", "bluetooth", "ble", "square-golf"]
categories = ["hardware-support", "science"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

# Linux: BlueZ over D-Bus. Also used for scanning even when GATT is elsewhere.
zbus = { version = "5", features = ["blocking-api"], optional = true }

# Cross-platform BLE. Verified on Windows (WinRT).
btleplug = { version = "0.11", optional = true }
flightrelay = { version = "0.5", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
# Config tests and docs build configs from JSON maps, as hosts do.
serde_json = "1"

[[bin]]
name = "allsquare-frp"
path = "src/bin/allsquare-frp.rs"
# A transport is also needed, but Cargo cannot express "frp AND (bluez OR
# btleplug)" — the binary emits a compile_error if neither is enabled.
required-features = ["frp"]

[features]
default = []
serde = ["dep:serde"]
bluez = ["dep:zbus"]
# The driver's settings (`allsquare::config`), with no BLE stack: what a
# settings form or a WebAssembly UI needs.
config = ["dep:flightrelay", "flightrelay/config", "serde"]
# The `DeviceDriver` (`allsquare::driver`). Connecting needs `bluez` or
# `btleplug` too.
driver = ["config", "flightrelay/driver"]
# The `allsquare-frp` binary.
frp = ["driver", "flightrelay/server", "flightrelay/main"]
btleplug = ["dep:btleplug", "dep:tokio", "dep:futures", "dep:uuid"]
# Temporary, for mapping the Omni's impact location to a reference launch
# monitor (divotmaker/allsquare#1): report impact as the unscaled wire values,
# with the device's signs, labeled millimeters.
raw-face-impact = []
# Notification fixtures and encoders (`allsquare::testing`) for tests of code
# that consumes the device's notifications. Not for production use.
testing = []

[package.metadata.docs.rs]
features = ["bluez", "frp", "serde", "testing"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
