[package]
name = "allsquare"
version = "0.5.1"
edition = "2024"
rust-version = "1.94"
description = "Client library for the Square Golf Omni launch monitor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/divotmaker/allsquare"
keywords = ["golf", "launch-monitor", "bluetooth", "ble", "square-golf"]
categories = ["hardware-support", "science"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
flightrelay = { version = "0.6.0", optional = true }

# BLE backend deps are optional and target-conditional: the `ble` feature
# turns them on, and only the right platform's deps are compiled.
# Linux: BlueZ over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", features = ["blocking-api"], optional = true }

# Elsewhere: btleplug. Verified on Windows (WinRT).
[target.'cfg(not(target_os = "linux"))'.dependencies]
btleplug = { version = "0.11", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"], optional = true }
futures = { version = "0.3", optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
# Config tests and docs build configs from JSON maps, as hosts do.
serde_json = "1"

[[bin]]
name = "allsquare-frp"
path = "src/bin/allsquare-frp.rs"
required-features = ["frp"]

[features]
default = []
# The platform BLE transport (`allsquare::ble`): BlueZ on Linux, btleplug
# elsewhere.
ble = ["dep:zbus", "dep:btleplug", "dep:tokio", "dep:futures", "dep:uuid"]
# Serde derives on the public data types.
serde = ["dep:serde"]
# The driver's settings (`allsquare::config`), with no BLE stack: what a
# settings form or a WebAssembly UI needs.
config = ["dep:flightrelay", "flightrelay/config", "serde"]
# The `FrpDriver` (`allsquare::driver`), with the BLE transport.
driver = ["config", "ble", "flightrelay/driver"]
# The `allsquare-frp` binary: the driver served over FRP.
frp = ["driver", "flightrelay/server", "flightrelay/main"]
# Temporary, for mapping the Omni's impact location to a reference launch
# monitor (divotmaker/allsquare#1): report impact as the unscaled wire values,
# with the device's signs, labeled millimeters.
raw-face-impact = []
# Notification fixtures and encoders (`allsquare::testing`) for tests of code
# that consumes the device's notifications. Not for production use.
testing = []

[package.metadata.docs.rs]
features = ["frp", "serde", "testing"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
