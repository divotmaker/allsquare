name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check each feature alone
        run: |
          cargo check --no-default-features
          for f in ble serde config driver frp raw-face-impact testing; do
            cargo check --no-default-features --features "$f"
          done

      - name: Run tests
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      # On Linux `ble` builds the BlueZ backend; btleplug is the backend on
      # Windows and macOS. Check it against a Windows target.
      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check btleplug backend (Windows target)
        run: cargo check --lib --target x86_64-pc-windows-gnu --features frp,serde
