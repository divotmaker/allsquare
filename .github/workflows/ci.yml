name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --features bluez,frp,serde -- -D warnings

      - name: Run tests
        run: cargo test --lib --features bluez,frp,serde

      - name: Check btleplug backend
        run: cargo check --lib --features btleplug,frp,serde
