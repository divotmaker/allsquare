name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets --features bluez,frp,serde -- -D warnings

      - name: Run tests
        run: cargo test --lib --features bluez,frp,serde

      # btleplug ships for Windows/macOS; Linux uses the bluez backend. Check
      # it against the target it is actually built for — compiling it natively
      # would pull btleplug's Linux backend (bluez-async -> dbus -> libdbus-sys)
      # and require libdbus-1-dev for a configuration that is never shipped.
      - name: Add Windows target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Check btleplug backend (Windows target)
        run: cargo check --lib --target x86_64-pc-windows-gnu --features btleplug,frp,serde
